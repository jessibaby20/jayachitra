<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitBuddy</title><link rel="stylesheet" href="{{ url_for('static',path='style.css') }}"></head><body><main class="shell"><section class="card"><p class="eyebrow">FITBUDDY • AI FITNESS PLANNER</p><h1>Build your 7-day plan.</h1><p class="muted">Enter your details to generate a practical wellness-focused workout plan.</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form action="/generate-workout" method="post" class="grid"><label>Name<input name="name" required></label><label>User ID<input name="user_id" required placeholder="FB001"></label><label>Age<input name="age" type="number" min="13" max="100" required></label><label>Weight (kg)<input name="weight" type="number" min="1" max="500" step=".1" required></label><label>Goal<select name="goal"><option>general wellness</option><option>weight loss</option><option>muscle gain</option><option>flexibility</option></select></label><label>Intensity<select name="intensity"><option>low</option><option selected>medium</option><option>high</option></select></label><button>Generate Plan →</button></form><nav><a href="/view-all-users">Admin / Coach View</a><a href="/docs">API Docs</a></nav></section></main></body></html>
